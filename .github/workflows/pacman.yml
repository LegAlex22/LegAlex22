name: Generate Pac-Man Game

on:
  schedule: # Se ejecuta automáticamente cada 24 horas
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions
  push: # Se ejecuta en cada push a la rama principal
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # Puedes poner el juego que quieras, por ejemplo 'pacman' o 'pacman,breakout'
          games: 'pacman'
          hide_month_labels: 'false'

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
