name: Living scene

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: yuki4266/living-scene@v1
        with:
          lat: "41.6176"
          lon: "0.6200"
          tz: "Europe/Madrid"
          path: ".github/workflows/scene-state" # <-- Aquí le indicamos dónde guardarlo

      - name: Move assets to profile folder
        run: |
          mkdir -p profile
          mv sky.svg sky-night.svg garden-footer.svg garden-footer-night.svg profile/ 2>/dev/null || true

      - name: Commit and push generated files
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update living scene assets and state"
          file_pattern: |
            profile/*.svg
            .github/workflows/scene-state
