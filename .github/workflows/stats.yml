name: Update Stats

on:
  schedule:
    - cron: "0 0 * * *" # Se ejecuta una vez al día a medianoche
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=LegAlex22&show_icons=true&theme=dark&bg_color=151515&include_all_commits=true&count_private=true&icon_color=FFA500
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=LegAlex22&layout=compact&langs_count=6&theme=dark&bg_color=151515&include_all_commits=true&count_private=true&icon_color=FFA500
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: streak
          options: username=LegAlex22&theme=dark&border_radius=10&date_format=j%20M%5B%20Y%5D&fire=FFA500&ring=FFA500&currStreakLabel=FFA500&background=151515
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
