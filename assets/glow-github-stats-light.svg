<svg width="190" height="28" viewBox="0 0 190 28" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Reducimos el blur máximo de 4 a 1.5 para que no se vea borroso -->
    <filter id="glow-dark" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0" result="blur">
        <animate attributeName="stdDeviation" values="0;1.5;0" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="0" y="22" text-anchor="start" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#000000" filter="url(#glow-dark)">
    GitHub Stats
  </text>
</svg>
