<svg width="145" height="28" viewBox="0 0 145 28" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- x="0" y="-30%" evita que la sombra mueva el texto hacia la derecha -->
    <filter id="glow" x="0" y="-30%" width="130%" height="160%">
      <feGaussianBlur stdDeviation="0" result="blur">
        <animate attributeName="stdDeviation" values="0;4;0" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Texto centrado con espacio suficiente para el resplandor -->
  <text x="0" y="22" text-anchor="start" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" filter="url(#glow)">
    About Me
  </text>
</svg>
